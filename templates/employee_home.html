{% extends "base_employee.html" %}

{% block title %}Employee - ATS{% endblock %}

{% block content %}
  <h1>Employee Page</h1>
  <p style="text-align: center; margin-bottom: 30px; color: #666;">
    Employee access only.
  </p>

  {% if current_user.is_authenticated %}
    <a class="btn" href="{{ url_for('dashboard') }}">Go to Recruitment Dashboard</a>
  {% else %}
    <a class="btn" href="{{ url_for('employee_login') }}">Employee Login</a>
    <div style="margin-top: 12px;">
      <a class="btn btn-secondary" href="{{ url_for('employee_register') }}">Employee Register</a>
    </div>
  {% endif %}
{% endblock %}
