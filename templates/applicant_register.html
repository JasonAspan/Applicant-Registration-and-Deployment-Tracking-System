{% extends "base_applicant.html" %}

{% block title %}Applicant Register - ATS{% endblock %}

{% block container_class %}applicant-registration-card{% endblock %}

{% block extra_css %}
<style>
  * {
    box-sizing: border-box;
  }
  
  body {
    background:
      linear-gradient(90deg, rgba(6, 18, 32, 0.74), rgba(6, 18, 32, 0.38) 46%, rgba(6, 18, 32, 0.68)),
      url("{{ url_for('static', filename='img/applicant-registration-bg.png') }}") center center / cover fixed no-repeat;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 28px 16px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(10, 17, 28, 0.2));
  }
  
  .container.applicant-registration-card {
    position: relative;
    z-index: 1;
    background: rgba(217, 232, 245, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.62);
    border-radius: 8px;
    padding: 12px 18px 26px;
    max-width: 640px;
    width: 100%;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
    backdrop-filter: none;
    animation: applicantFadeFront 0.72s ease-out both;
  }
  
  .registration-header {
    text-align: center;
    margin-bottom: 26px;
  }
  
  .company-logo {
    width: auto;
    max-width: 416px;
    height: auto;
    margin: 0 auto 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .company-logo img {
    width: 100%;
    height: auto;
    max-width: 416px;
    display: block;
  }
  
  .registration-header h1 {
    margin: 0;
    color: #10283c;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0;
    text-align: center;
  }
  
  .form-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 26px;
  }

  .form-row.centered-three {
    grid-template-columns: repeat(3, 1fr);
    max-width: 462px;
    margin-left: auto;
    margin-right: auto;
  }
  
  .form-row.full {
    grid-template-columns: 1fr;
  }
  
  .form-group {
    display: flex;
    flex-direction: column;
  }
  
  .form-group label {
    font-size: 11px;
    font-weight: 700;
    color: #17324a;
    margin-bottom: 8px;
    text-align: center;
    letter-spacing: 0;
  }
  
  .form-group input,
  .form-group select {
    min-height: 32px;
    padding: 7px 10px;
    border: 2px solid #b8b8b8;
    border-radius: 3px;
    font-size: 11px;
    background: rgba(255, 255, 255, 0.95);
    color: #1c2936;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  
  .form-group input:focus,
  .form-group select:focus {
    outline: none;
    border-color: #1769a8;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(23, 105, 168, 0.18);
  }

  .position-picker {
    position: relative;
  }

  .position-picker-button {
    width: 100%;
    min-height: 32px;
    padding: 7px 10px;
    border: 2px solid #b8b8b8;
    border-radius: 3px;
    font-size: 11px;
    background: rgba(255, 255, 255, 0.95);
    color: #1c2936;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
  }

  .position-picker-button:focus {
    outline: none;
    border-color: #1769a8;
    box-shadow: 0 0 0 3px rgba(23, 105, 168, 0.18);
  }

  .position-options {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    z-index: 20;
    max-height: 180px;
    overflow-y: auto;
    border: 1px solid #1769a8;
    border-radius: 6px;
    background: white;
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
  }

  .position-options.hidden {
    display: none;
  }

  .position-option {
    width: 100%;
    display: block;
    padding: 10px 12px;
    border: 0;
    border-bottom: 1px solid #e5e7eb;
    background: white;
    color: #17324a;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  .position-option:hover,
  .position-option:focus {
    outline: none;
    background: #eaf4fb;
  }
  
  #cv {
    min-height: 38px;
    padding: 6px 10px;
    cursor: pointer;
  }
  
  #cv::file-selector-button {
    background: #1769a8;
    color: white;
    padding: 8px 15px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-right: 10px;
    font-weight: 600;
    transition: background 0.3s;
  }
  
  #cv::file-selector-button:hover {
    background: #0f4f82;
  }
  
  .form-actions {
    text-align: center;
    margin-top: 16px;
  }
  
  .container.applicant-registration-card .btn {
    background: #c91f37;
    color: white;
    border: none;
    width: 216px;
    height: 51px;
    min-height: 51px;
    padding: 0 24px;
    font-size: 29px;
    font-weight: 700;
    border-radius: 0;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 12px 28px rgba(201, 31, 55, 0.28);
  }
  
  .container.applicant-registration-card .btn:hover {
    background: #a9162a;
    transform: translateY(-1px);
  }
  
  .container.applicant-registration-card .btn:active {
    background: #9f0f29;
  }
  
  .alert {
    margin-bottom: 20px;
    padding: 14px 16px;
    border-radius: 6px;
    font-size: 14px;
  }
  
  .alert-error {
    background: #fee;
    color: #c00;
    border: 1px solid #fcc;
  }
  
  .alert-success {
    background: #efe;
    color: #0a0;
    border: 1px solid #cfc;
  }

  @keyframes applicantFadeFront {
    from {
      opacity: 0;
      transform: scale(0.94);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .container.applicant-registration-card {
      animation: none;
    }
  }
  
  /* Tablet - 768px to 1024px */
  @media (max-width: 1024px) {
    body {
      background-attachment: scroll;
    }

    .container.applicant-registration-card {
      padding: 12px 18px 26px;
    }
    
    .form-row {
      gap: 14px;
    }
    
    .registration-header h1 {
      font-size: 24px;
    }
  }
  
  /* Tablet - 600px to 768px */
  @media (max-width: 768px) {
    body {
      padding: 16px 12px;
    }
    
    .container.applicant-registration-card {
      padding: 14px 18px 24px;
      border-radius: 8px;
    }
    
    .company-logo {
      max-width: 400px;
      margin: 0 auto 8px;
    }
    
    .company-logo img {
      max-width: 400px;
    }
    
    .registration-header {
      margin-bottom: 22px;
    }
    
    .registration-header h1 {
      font-size: 22px;
      letter-spacing: 0;
    }
    
    .form-row {
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .form-row.centered-three {
      grid-template-columns: repeat(2, 1fr);
      max-width: none;
    }
    
    .form-group label {
      font-size: 12px;
      margin-bottom: 8px;
    }
    
    .form-group input,
    .form-group select {
      padding: 8px 10px;
      font-size: 12px;
    }
    
    .container.applicant-registration-card .btn {
      width: 216px;
      height: 51px;
      min-height: 51px;
      padding: 0 24px;
      font-size: 29px;
    }
  }
  
  /* Small tablet - 480px to 600px */
  @media (max-width: 600px) {
    body {
      padding: 10px;
    }
    
    .container.applicant-registration-card {
      padding: 25px 18px;
      border-radius: 8px;
    }
    
    .company-logo {
      max-width: 344px;
      margin: 0 auto 8px;
    }
    
    .company-logo img {
      max-width: 344px;
    }
    
    .registration-header h1 {
      font-size: 20px;
      letter-spacing: 0;
    }
    
    .form-row {
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .form-row.centered-three {
      grid-template-columns: repeat(2, 1fr);
      max-width: none;
    }
    
    .form-group label {
      font-size: 13px;
      margin-bottom: 6px;
    }
    
    .form-group input,
    .form-group select {
      padding: 9px 11px;
      font-size: 12px;
    }
    
    .container.applicant-registration-card .btn {
      width: 208px;
      height: 50px;
      min-height: 50px;
      padding: 0 22px;
      font-size: 27px;
      letter-spacing: 1px;
    }
  }
  
  /* Mobile - 375px to 480px */
  @media (max-width: 480px) {
    body {
      padding: 8px;
    }
    
    .container.applicant-registration-card {
      padding: 22px 15px;
      border-radius: 8px;
    }
    
    .company-logo {
      max-width: 272px;
      margin: 0 auto 8px;
    }
    
    .company-logo img {
      max-width: 272px;
    }
    
    .registration-header {
      margin-bottom: 20px;
    }
    
    .registration-header h1 {
      font-size: 18px;
      letter-spacing: 0;
    }
    
    .form-row {
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .form-row.centered-three {
      grid-template-columns: 1fr;
      max-width: none;
    }
    
    .form-group label {
      font-size: 13px;
      margin-bottom: 5px;
    }
    
    .form-group input,
    .form-group select {
      padding: 8px 10px;
      font-size: 12px;
    }
    
    .container.applicant-registration-card .btn {
      width: 190px;
      height: 48px;
      min-height: 48px;
      padding: 0 18px;
      font-size: 24px;
      letter-spacing: 0.5px;
    }
  }
  
  /* Small mobile - up to 375px */
  @media (max-width: 375px) {
    body {
      padding: 6px;
    }
    
    .container.applicant-registration-card {
      padding: 20px 12px;
      border-radius: 8px;
    }
    
    .company-logo {
      max-width: 234px;
      margin: 0 auto 8px;
    }
    
    .company-logo img {
      max-width: 234px;
    }
    
    .registration-header h1 {
      font-size: 16px;
    }
    
    .form-group label {
      font-size: 12px;
      margin-bottom: 4px;
    }
    
    .form-group input,
    .form-group select {
      padding: 7px 9px;
      font-size: 11px;
    }
    
    .container.applicant-registration-card .btn {
      width: 172px;
      height: 46px;
      min-height: 46px;
      padding: 0 14px;
      font-size: 21px;
    }
  }
</style>
{% endblock %}

{% block content %}
  <div class="registration-header">
    <div class="company-logo">
      <img src="{{ url_for('static', filename='img/company-logo.png') }}" alt="Company Logo">
    </div>
    <h1>APPLICANT REGISTRATION FORM</h1>
  </div>

  <form method="POST" id="applicant-register-form" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-row">
      <div class="form-group">
        <label for="last_name">Last Name</label>
        <input type="text" id="last_name" name="last_name" required pattern="[A-Za-z\s-']+" title="No numbers allowed">
      </div>
      <div class="form-group">
        <label for="first_name">First Name</label>
        <input type="text" id="first_name" name="first_name" required pattern="[A-Za-z\s-']+" title="No numbers allowed">
      </div>
      <div class="form-group">
        <label for="middle_initial">Middle Name</label>
        <input type="text" id="middle_initial" name="middle_initial" required pattern="[A-Za-z\s-']+" title="No numbers allowed">
      </div>
      <div class="form-group">
        <label for="suffix">Suffix.</label>
        <input type="text" id="suffix" name="suffix" maxlength="20" pattern="[A-Za-z.,\s]+" title="No numbers allowed">
      </div>
    </div>

    <div class="form-row centered-three">
      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="16" max="65" required>
      </div>
      <div class="form-group">
        <label for="birth_date">Birth Date</label>
        <input type="date" id="birth_date" name="birth_date" required>
      </div>
    </div>

    <div class="form-row centered-three">
      <div class="form-group">
        <label for="contact_number">Contact Number</label>
        <input type="tel" id="contact_number" name="contact_number" placeholder="+63 XXXXXXXXXX" maxlength="10" required pattern="[0-9]{10}" title="Contact number must be 10 digits with no letters">
      </div>
      <div class="form-group">
        <label for="email">E-mail Address</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="job_position">Position</label>
        <div class="position-picker" id="position-picker">
          <button type="button" class="position-picker-button" id="positionDropdown" aria-expanded="false" aria-controls="positionOptions">
            Loading positions...
          </button>
          <div class="position-options hidden" id="positionOptions" role="listbox">
          </div>
        </div>
        <input type="hidden" id="job_position" name="job_position" required>
      </div>
    </div>

    <div class="form-row full">
      <div class="form-group">
        <label for="cv">Upload CV</label>
        <input type="file" id="cv" name="cv" accept="application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.pdf,.doc,.docx">
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn">Submit</button>
    </div>
  </form>
{% endblock %}

{% block extra_js %}
<script>
  // Prevent numbers in name fields
  function validateNameInput(field) {
    field.addEventListener('input', function() {
      this.value = this.value.replace(/[0-9]/g, '');
    });
  }
  
  // Prevent letters in contact number and limit to 10 digits
  function validateContactNumber(field) {
    field.addEventListener('input', function() {
      // Remove all non-numeric characters
      let value = this.value.replace(/[^0-9]/g, '');
      // Limit to 10 digits
      if (value.length > 10) {
        value = value.substring(0, 10);
      }
      this.value = value;
    });
  }
  
  // Validate age on input
  function validateAge(field) {
    field.addEventListener('change', function() {
      if (this.value > 65) {
        this.value = 65;
        alert('Maximum age allowed is 65 years old');
      }
      if (this.value < 16) {
        this.value = 16;
        alert('Minimum age allowed is 16 years old');
      }
    });
  }
  
  // Load positions from API
  function loadPositions() {
    const input = document.getElementById('job_position');
    const dropdown = document.getElementById('positionDropdown');
    const options = document.getElementById('positionOptions');

    fetch('/api/positions')
      .then(response => response.json())
      .then(positions => {
        input.value = '';
        options.innerHTML = '';
        
        if (!positions || positions.length === 0) {
          dropdown.textContent = 'No positions available';
          dropdown.disabled = true;
          return;
        }

        dropdown.textContent = 'Select Position';
        dropdown.disabled = false;
        positions.forEach(pos => {
          const option = document.createElement('button');
          option.type = 'button';
          option.className = 'position-option';
          option.setAttribute('role', 'option');
          option.textContent = pos.title;
          option.addEventListener('click', function() {
            input.value = pos.title;
            dropdown.textContent = pos.title;
            options.classList.add('hidden');
            dropdown.setAttribute('aria-expanded', 'false');
          });
          options.appendChild(option);
        });
      })
      .catch(error => {
        console.error('Error loading positions:', error);
        dropdown.textContent = 'Error loading positions';
        dropdown.disabled = true;
      });
  }

  function initializePositionDropdown() {
    const dropdown = document.getElementById('positionDropdown');
    const options = document.getElementById('positionOptions');

    dropdown.addEventListener('click', function() {
      if (dropdown.disabled) return;
      const isHidden = options.classList.toggle('hidden');
      dropdown.setAttribute('aria-expanded', isHidden ? 'false' : 'true');
    });

    document.addEventListener('click', function(e) {
      if (!document.getElementById('position-picker').contains(e.target)) {
        options.classList.add('hidden');
        dropdown.setAttribute('aria-expanded', 'false');
      }
    });
  }
  
  // Initialize validators on document load
  document.addEventListener('DOMContentLoaded', function() {
    const lastNameField = document.getElementById('last_name');
    const firstNameField = document.getElementById('first_name');
    const middleNameField = document.getElementById('middle_initial');
    const suffixField = document.getElementById('suffix');
    const contactField = document.getElementById('contact_number');
    const ageField = document.getElementById('age');
    const form = document.getElementById('applicant-register-form');
    
    // Load positions from API
    initializePositionDropdown();
    loadPositions();
    
    // Apply validators
    if (lastNameField) validateNameInput(lastNameField);
    if (firstNameField) validateNameInput(firstNameField);
    if (middleNameField) validateNameInput(middleNameField);
    if (suffixField) validateNameInput(suffixField);
    if (contactField) validateContactNumber(contactField);
    if (ageField) validateAge(ageField);
    
    // Form submission validation
    if (form) {
      form.addEventListener('submit', function(e) {
        // Additional validation on submit
        if (ageField && ageField.value > 65) {
          e.preventDefault();
          alert('Maximum age allowed is 65 years old');
          return false;
        }
        if (contactField && contactField.value.length !== 10) {
          e.preventDefault();
          alert('Contact number must be exactly 10 digits');
          return false;
        }
        if (!document.getElementById('job_position').value) {
          e.preventDefault();
          alert('Please select a position');
          return false;
        }
      });
    }
  });
</script>
{% endblock %}
