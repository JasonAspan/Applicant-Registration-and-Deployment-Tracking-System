<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applicant Registration - ATS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Applicant Registration</h1>
    <p style="text-align: center; margin-bottom: 30px; color: #666;">Fill out the form to apply. Your data will be available on the employee dashboard.</p>
    
    <form id="applicant-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      
      <div class="form-group">
        <label for="resume">Resume / Cover Letter</label>
        <textarea id="resume" name="resume" placeholder="Tell us about your experience..." required></textarea>
      </div>
      
      <button type="submit" class="btn">Apply Now</button>
    </form>
    
    <div class="nav-links">
      <a href="employee-register.html">Employee Register</a> |
      <a href="employee-login.html">Employee Login</a> |
      <a href="dashboard.html">View Dashboard</a>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
